# Conda environment for the CSB metabolic modelling practical (session 10).
#
# Verified on 2026-10-28: environment builds clean, iJO1366 loads in 1.7 s,
# FBA runs in 0.15 s, 50 single gene knock-outs in 0.2 s, peak memory 303 MB.
# Comfortably inside the Binder limits.
#
# Replaces requirements.txt (cobra, swiglpk), which left the python version and
# the solver to chance.

name: CSB

channels:
  - conda-forge

dependencies:
  - python=3.12
  - cobra=0.32.1
  - glpk=5.0
  - swiglpk=5.0.13
  - jupyterlab=4.6.4
  - notebook=7.6.3
  - ipykernel=7.4.0
  - ipywidgets=8.1.9
  - numpy=2.5.4
  - pandas=2.3.3
  - matplotlib=3.11.2
  - seaborn=0.13.2
