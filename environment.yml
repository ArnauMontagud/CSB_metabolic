# Conda environment for the CSB metabolic modelling practical (session 10).
#
# Verified on 2026-11-22 with the rebuilt notebook, on Linux:
#   environment solves and builds clean
#   iJO1366 (bundled with COBRApy, no download) loads in 2.2 s
#   FBA runs in 0.15 s, the two genome-wide single_gene_deletion runs take 6.4 s each
#   the whole solution notebook runs end to end in 27 s, 0 errors, 2 figures
#
# seaborn and ipywidgets were removed on 2026-11-22: the notebook was executed with
# both blocked at import time and ran unchanged. Put ipywidgets back if a future
# version of the notebook uses interactive widgets.

name: CSB

channels:
  - conda-forge

dependencies:
  - python=3.12
  - cobra=0.32.1
  - glpk=5.0
  - swiglpk=5.0.13
  - jupyterlab=4.6.4
  - notebook=7.6.3
  - ipykernel=7.4.0
  - numpy=2.5.4
  - pandas=2.3.3
  - matplotlib=3.11.2
